<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng ký - SSCare</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus_Jakarta_Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#d9dadf",
                    "on-tertiary-container": "#ffbc7a",
                    "surface-tint": "#28609e",
                    "outline": "#727781",
                    "on-tertiary-fixed-variant": "#693c00",
                    "surface-container": "#ededf3",
                    "surface-variant": "#e1e2e8",
                    "tertiary-fixed": "#ffdcbe",
                    "secondary-fixed": "#d6e5ef",
                    "on-primary-container": "#aaccff",
                    "on-secondary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#f0f0f6",
                    "tertiary-container": "#7d4800",
                    "secondary-container": "#d3e2ed",
                    "on-surface": "#191c20",
                    "on-surface-variant": "#424750",
                    "on-primary-fixed-variant": "#004884",
                    "tertiary": "#5c3400",
                    "on-secondary-fixed": "#0f1d25",
                    "on-primary-fixed": "#001c39",
                    "on-secondary-fixed-variant": "#3b4951",
                    "surface-container-low": "#f3f3f9",
                    "background": "#f9f9ff",
                    "on-primary": "#ffffff",
                    "secondary": "#526069",
                    "surface": "#f9f9ff",
                    "inverse-primary": "#a4c9ff",
                    "tertiary-fixed-dim": "#ffb870",
                    "secondary-fixed-dim": "#bac9d3",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#a4c9ff",
                    "on-tertiary-fixed": "#2c1600",
                    "on-background": "#191c20",
                    "surface-bright": "#f9f9ff",
                    "surface-container-highest": "#e1e2e8",
                    "primary-fixed": "#d4e3ff",
                    "primary": "#003e74",
                    "primary-container": "#1a5694",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#e7e8ee",
                    "outline-variant": "#c2c6d2",
                    "error-container": "#ffdad6",
                    "on-secondary-container": "#56656e",
                    "error": "#ba1a1a",
                    "inverse-surface": "#2e3035"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "display": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-resolve justify-center">
<div class="w-full max-w-md bg-surface min-h-screen flex flex-col relative overflow-hidden">
<!-- TopAppBar Navigation -->
<header class="docked full-width top-0 flex items-center justify-start px-6 py-4 w-full bg-[#f9f9ff] dark:bg-slate-950 no-border">
<button class="material-symbols-outlined text-[#003e74] dark:text-blue-400 p-2 hover:bg-[#d3e2ed] dark:hover:bg-slate-800 rounded-full transition-all duration-300 active:scale-95 transition-transform" data-icon="arrow_back">
                arrow_back
            </button>
<h1 class="ml-4 font-['Plus_Jakarta_Sans'] font-bold text-xl tracking-tight text-[#003e74] dark:text-blue-400">
                Đăng ký
            </h1>
</header>
<!-- Progress Decoration -->
<div class="px-8 mt-4">
<div class="h-1.5 w-full bg-secondary-container rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-primary-container rounded-full"></div>
</div>
</div>
<main class="flex-1 px-8 pt-10 pb-24">
<!-- Illustration removed per request -->
<!-- Identity Selection -->
<section class="space-y-6">
<p class="text-on-surface-variant font-medium text-lg ml-1">Bạn là:</p>
<div class="space-y-4">
<!-- Option 1: Selected -->
<label class="relative flex items-center p-5 rounded-lg bg-surface-container-lowest border-2 border-primary cursor-pointer transition-all duration-200 group active:scale-[0.98]">
<input checked="" class="hidden" name="role" type="radio" value="bo"/>
<div class="flex-1 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<span class="font-semibold text-primary text-lg">Bố</span>
</div>
<div class="flex items-center justify-center w-6 h-6 rounded-full bg-primary text-on-primary">
<span class="material-symbols-outlined text-sm" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</label>
<!-- Option 2 -->
<label class="relative flex items-center p-5 rounded-lg bg-surface-container-low border-2 border-transparent hover:border-outline-variant cursor-pointer transition-all duration-200 active:scale-[0.98]">
<input class="hidden" name="role" type="radio" value="me"/>
<div class="flex-1 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="face_3">face_3</span>
</div>
<span class="font-semibold text-on-surface text-lg">Mẹ</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</label>
<!-- Option 3 -->
<label class="relative flex items-center p-5 rounded-lg bg-surface-container-low border-2 border-transparent hover:border-outline-variant cursor-pointer transition-all duration-200 active:scale-[0.98]">
<input class="hidden" name="role" type="radio" value="nguoi-giam-ho"/>
<div class="flex-1 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
</div>
<span class="font-semibold text-on-surface text-lg">Người giám hộ khác</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</label>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<footer class="sticky bottom-0 p-8 bg-surface/80 backdrop-blur-md">
<button class="w-full py-4 px-6 bg-primary text-on-primary rounded-full font-bold text-lg shadow-lg shadow-primary/20 active:scale-95 transition-all duration-300">
                Tiếp tục
            </button>
<p class="text-center mt-4 text-sm text-on-surface-variant">
                Bước 1 của 3
            </p>
</footer>
<!-- Background Decorative Elements -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-secondary-container/30 rounded-full blur-3xl -z-10"></div>
<div class="absolute top-1/2 -left-20 w-48 h-48 bg-primary-fixed/20 rounded-full blur-2xl -z-10"></div>
</div>
</body></html>
