</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#d3e2ed] dark:hover:bg-slate-800 transition-colors" style="">

</button>

<!-- Main Content -->
<main class="mt-24 px-6 flex-grow">
<!-- Tab Bar -->
<nav class="flex p-1 bg-surface-container-low rounded-full mb-8">
<button class="flex-1 py-3 text-sm font-semibold text-slate-500 rounded-full hover:bg-surface-container transition-all" style="">

            </button>
<button class="flex-1 py-3 text-sm font-bold bg-primary-container text-on-primary-container rounded-full shadow-sm" style="">
                Ghi chú
            </button>
</nav>
<!-- Welcome & Description -->
<section class="mb-8">
<p class="text-on-surface text-lg font-medium leading-relaxed" style="">
                Lưu trữ các thông tin cần chú ý để hỗ trợ con tốt hơn!
            </p>
</section>
<!-- Month Selector -->
<div class="mb-8 flex justify-end">
<button class="flex items-center gap-2 bg-surface-container-lowest px-5 py-2.5 rounded-full shadow-sm border border-outline-variant/20" style="">
<span class="text-sm font-semibold text-primary" style="">Tháng 3/2024</span>
<span class="material-symbols-outlined text-sm" style="">expand_more</span>
</button>
</div>
<!-- Form Section -->
<div class="space-y-6">
<!-- Tên ghi chú -->
<div class="space-y-2">
<label class="block text-sm font-bold text-primary ml-1" style="">Tên ghi chú</label>
<input class="w-full px-6 py-4 bg-surface-container-highest border-none rounded-md focus:ring-2 focus:ring-surface-tint/30 text-on-surface placeholder:text-on-surface-variant/50 transition-all" placeholder="Nhập tiêu đề ghi chú..." type="text"/>
</div>
<!-- Thời gian thực hiện -->
<div class="space-y-2">
<label class="block text-sm font-bold text-primary ml-1" style="">Thời gian thực hiện dự kiến</label>
<div class="relative">
<input class="w-full px-6 py-4 bg-surface-container-highest border-none rounded-md focus:ring-2 focus:ring-surface-tint/30 text-on-surface cursor-pointer" placeholder="Chọn ngày..." readonly="" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary pointer-events-none" style="">calendar_month</span>
</div>
</div>
<!-- Nội dung ghi chú -->
<div class="space-y-2">
<label class="block text-sm font-bold text-primary ml-1" style="">Nội dung ghi chú</label>
<textarea class="w-full px-6 py-4 bg-surface-container-highest border-none rounded-md focus:ring-2 focus:ring-surface-tint/30 text-on-surface placeholder:text-on-surface-variant/50 resize-none transition-all" placeholder="Viết chi tiết nội dung tại đây..." rows="6"></textarea>
</div>
</div>
<!-- Narrative Bento Preview (Aesthetic Touch) -->
</main>
<!-- Bottom Action Buttons -->
<div class="flex gap-4 pt-6 pb-12 px-6">
<button class="flex-1 py-4 px-6 rounded-full font-headline font-bold border-2 border-primary text-primary hover:bg-secondary-container transition-all active:scale-95">

    </button>
<button class="flex-1 py-4 px-6 rounded-full font-headline font-bold bg-primary text-on-primary shadow-lg hover:bg-primary-container transition-all active:scale-95">

    </button>
