<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "tertiary-container": "#7d4800",
                  "secondary-fixed-dim": "#bac9d3",
                  "on-tertiary-fixed": "#2c1600",
                  "primary-fixed-dim": "#a4c9ff",
                  "on-background": "#191c20",
                  "secondary-fixed": "#d6e5ef",
                  "surface-container-lowest": "#ffffff",
                  "on-primary-fixed-variant": "#004884",
                  "secondary": "#526069",
                  "on-tertiary-fixed-variant": "#693c00",
                  "on-tertiary-container": "#ffbc7a",
                  "on-primary-fixed": "#001c39",
                  "primary": "#003e74",
                  "on-secondary": "#ffffff",
                  "background": "#f9f9ff",
                  "on-surface-variant": "#424750",
                  "on-primary-container": "#aaccff",
                  "on-error": "#ffffff",
                  "inverse-surface": "#2e3035",
                  "primary-fixed": "#d4e3ff",
                  "surface-dim": "#d9dadf",
                  "on-secondary-container": "#56656e",
                  "tertiary-fixed": "#ffdcbe",
                  "surface-bright": "#f9f9ff",
                  "error-container": "#ffdad6",
                  "error": "#ba1a1a",
                  "tertiary": "#5c3400",
                  "primary-container": "#1a5694",
                  "inverse-primary": "#a4c9ff",
                  "surface": "#f9f9ff",
                  "outline": "#727781",
                  "on-secondary-fixed": "#0f1d25",
                  "tertiary-fixed-dim": "#ffb870",
                  "surface-container-low": "#f3f3f9",
                  "on-error-container": "#93000a",
                  "outline-variant": "#c2c6d2",
                  "surface-container-highest": "#e1e2e8",
                  "on-primary": "#ffffff",
                  "surface-container": "#ededf3",
                  "secondary-container": "#d3e2ed",
                  "on-tertiary": "#ffffff",
                  "inverse-on-surface": "#f0f0f6",
                  "surface-tint": "#28609e",
                  "surface-container-high": "#e7e8ee",
                  "on-surface": "#191c20",
                  "surface-variant": "#e1e2e8",
                  "on-secondary-fixed-variant": "#3b4951"
          },
          "borderRadius": {
                  "DEFAULT": "1rem",
                  "lg": "2rem",
                  "xl": "3rem",
                  "full": "9999px"
          },
          "fontFamily": {
                  "headline": ["Plus Jakarta Sans"],
                  "display": ["Plus Jakarta Sans"],
                  "body": ["Inter"],
                  "label": ["Inter"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .star-active {
      font-variation-settings: 'FILL' 1;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface">
<!-- Background Article Detail (Dimmed Simulation) -->
<main class="min-h-screen flex flex-col items-center justify-center p-6 bg-surface-dim">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
<!-- Rating Modal Card -->
<section class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_24px_40px_rgba(0,62,116,0.12)] overflow-hidden relative border border-outline-variant/15">
<!-- Header Image Block -->
<div class="relative h-32 w-full overflow-hidden">
<img class="w-full h-full object-cover" data-alt="Dreamy mountains with soft morning mist and a peaceful blue sky, editorial photography style, gentle guardian atmosphere" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9msOgMJj6Kh52IU577nyEWXYsgz1LugrOVW202gY6tuHyQutUg1eLWpbj9QJ7uJw8luLlAYKKlIYdYm0ap5IyLaT68NsxIRfa50qAGZmBLykFBNUDGLf3A_MWIVF9DkY2uGcSe2kwzPomtUzuDgttss6siQSpRLyzbZPF7zPd_nHDSDt18w9bDWp3kInSjMNjuYsGB09Z45A4avvPIyEPlhJqZMYR0Gk46MyUFhqfwEFzMdOTAk4jCD6UF98yXKPI4Rdn0Eu0YoWp"/>
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-lowest"></div>
</div>
<div class="px-8 pb-8 -mt-6 relative z-10 text-center">
<!-- Close Icon -->
<!-- Headline -->
<h2 class="font-display font-bold text-2xl text-primary tracking-tight mb-2">Đánh giá bài viết</h2>
<p class="font-body text-on-surface-variant text-sm px-4 mb-8 leading-relaxed">
            Ý kiến của bạn giúp chúng tôi cải thiện nội dung chăm sóc bé yêu mỗi ngày.
          </p>
<!-- 5-Star Selector -->
<div class="flex justify-center gap-2 mb-10">
<button class="group p-2 rounded-full hover:bg-secondary-container transition-all">
<span class="material-symbols-outlined text-4xl text-tertiary-fixed-dim star-active">star</span>
</button>
<button class="group p-2 rounded-full hover:bg-secondary-container transition-all">
<span class="material-symbols-outlined text-4xl text-tertiary-fixed-dim star-active">star</span>
</button>
<button class="group p-2 rounded-full hover:bg-secondary-container transition-all">
<span class="material-symbols-outlined text-4xl text-tertiary-fixed-dim star-active">star</span>
</button>
<button class="group p-2 rounded-full hover:bg-secondary-container transition-all">
<span class="material-symbols-outlined text-4xl text-tertiary-fixed-dim star-active">star</span>
</button>
<button class="group p-2 rounded-full hover:bg-secondary-container transition-all">
<span class="material-symbols-outlined text-4xl text-outline-variant">star</span>
</button>
</div>
<!-- Feedback Input (Implicit context from rating modal) -->
<div class="mb-8">
<textarea class="w-full bg-surface-container-low border-none rounded-lg p-4 text-sm font-body focus:ring-2 focus:ring-primary-fixed-dim transition-all resize-none h-24" placeholder="Chia sẻ thêm cảm nhận của bạn... (không bắt buộc)"></textarea>
</div>
<!-- Primary Button -->
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary font-display font-bold text-lg rounded-full shadow-[0_8px_20px_-4px_rgba(0,62,116,0.3)] hover:scale-[1.02] active:scale-95 transition-all">
            Gửi
          </button>
<!-- Secondary/Cancel Action -->
<button class="mt-4 text-sm font-label font-semibold text-secondary hover:text-primary transition-colors tracking-wide uppercase">
            Để sau
          </button>
</div>
<!-- Decorative Accent -->
<div class="absolute bottom-0 left-0 w-full h-1.5 bg-gradient-to-r from-primary via-tertiary-fixed-dim to-primary"></div>
</section>
</div>
<!-- Article Background content (for visual context) -->
<article class="max-w-2xl w-full bg-surface-container-low rounded-xl p-8 opacity-40 select-none pointer-events-none">
<div class="w-20 h-2 bg-primary/20 rounded-full mb-6"></div>
<div class="h-10 w-3/4 bg-primary/10 rounded-md mb-4"></div>
<div class="space-y-4">
<div class="h-4 w-full bg-on-surface-variant/10 rounded-full"></div>
<div class="h-4 w-5/6 bg-on-surface-variant/10 rounded-full"></div>
<div class="h-4 w-full bg-on-surface-variant/10 rounded-full"></div>
<div class="h-4 w-4/5 bg-on-surface-variant/10 rounded-full"></div>
</div>
<div class="mt-12 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container"></div>
<div class="space-y-1">
<div class="h-3 w-24 bg-primary/10 rounded-full"></div>
<div class="h-2 w-16 bg-primary/10 rounded-full"></div>
</div>
</div>
<div class="h-10 w-32 bg-primary rounded-full"></div>
</div>
</article>
</main>
</body></html>
