workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: our-flutter-project

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build iOS app without codesigning
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -r SSCare-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/SSCare-unsigned.ipa
      - our-flutter-project/build/ios/ipa/SSCare-unsigned.ipa

  android-release:
    name: Android release APK
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: our-flutter-project

    environment:
      flutter: stable

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build Android release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - our-flutter-project/build/app/outputs/flutter-apk/app-release.apk
