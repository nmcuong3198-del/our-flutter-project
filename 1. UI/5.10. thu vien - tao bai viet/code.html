<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tạo bài viết - SSCare</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f9f9ff",
                        "on-secondary-fixed-variant": "#3b4951",
                        "tertiary-container": "#7d4800",
                        "tertiary": "#5c3400",
                        "surface-container-low": "#f3f3f9",
                        "on-error": "#ffffff",
                        "surface-bright": "#f9f9ff",
                        "primary-fixed": "#d4e3ff",
                        "inverse-primary": "#a4c9ff",
                        "primary": "#003e74",
                        "secondary-fixed-dim": "#bac9d3",
                        "background": "#f9f9ff",
                        "surface-tint": "#28609e",
                        "outline": "#727781",
                        "primary-fixed-dim": "#a4c9ff",
                        "on-secondary-container": "#56656e",
                        "on-error-container": "#93000a",
                        "surface-container": "#ededf3",
                        "outline-variant": "#c2c6d2",
                        "secondary-container": "#d3e2ed",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#0f1d25",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#e1e2e8",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d6e5ef",
                        "on-tertiary-container": "#ffbc7a",
                        "on-primary-fixed": "#001c39",
                        "inverse-on-surface": "#f0f0f6",
                        "tertiary-fixed": "#ffdcbe",
                        "surface-container-highest": "#e1e2e8",
                        "on-tertiary-fixed": "#2c1600",
                        "secondary": "#526069",
                        "on-primary-container": "#aaccff",
                        "tertiary-fixed-dim": "#ffb870",
                        "on-surface-variant": "#424750",
                        "on-surface": "#191c20",
                        "on-primary-fixed-variant": "#004884",
                        "on-background": "#191c20",
                        "on-tertiary-fixed-variant": "#693c00",
                        "primary-container": "#1a5694",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d9dadf",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#e7e8ee",
                        "inverse-surface": "#2e3035"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9ff;
            color: #191c20;
            -webkit-tap-highlight-color: transparent;
        }
        .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e1e2e8; border-radius: 10px; }
        .glass-header {
            backdrop-filter: blur(12px);
            background-color: rgba(249, 249, 255, 0.85);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 glass-header">
<div class="flex items-center justify-between px-6 py-4 w-full">
<button class="active:scale-95 transition-transform duration-200 p-2 -ml-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-lg font-bold tracking-tight text-primary">Tạo bài viết</h1>
</div>
</header>
<main class="max-w-2xl mx-auto px-6 pt-24 space-y-8">
<!-- Title Field -->
<section class="space-y-3">
<div class="flex justify-between items-end">
<label class="font-headline font-bold text-primary ml-1">Tiêu đề</label>
<span class="text-[10px] text-on-surface-variant font-medium bg-surface-container px-2 py-0.5 rounded-full" id="title-counter">0/100</span>
</div>
<input class="w-full bg-surface-container-highest border-none rounded-full px-6 py-4 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-surface-tint transition-all outline-none" maxlength="100" oninput="document.getElementById('title-counter').innerText = this.value.length + '/100'" placeholder="Nhập tiêu đề (tối đa 100 ký tự)" type="text"/>
</section>
<!-- Cover Image Upload -->
<section class="space-y-3">
<label class="font-headline font-bold text-primary ml-1">Ảnh bìa</label>
<div class="relative group cursor-pointer aspect-[16/9] w-full rounded-xl overflow-hidden bg-surface-container-highest border-2 border-dashed border-outline-variant hover:border-primary transition-colors flex flex-col items-center justify-center gap-2">
<div class="p-4 rounded-full bg-primary-fixed text-on-primary-fixed-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
<p class="text-sm font-medium text-on-surface-variant">Thêm ảnh bìa bài viết</p>
<input class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
</section>
<!-- Summary -->
<section class="space-y-3">
<div class="flex justify-between items-end">
<label class="font-headline font-bold text-primary ml-1">Tóm tắt</label>
<span class="text-[10px] text-on-surface-variant font-medium bg-surface-container px-2 py-0.5 rounded-full" id="summary-counter">0/500</span>
</div>
<textarea class="w-full min-h-[120px] bg-surface-container-highest border-none rounded-lg p-6 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-surface-tint transition-all outline-none resize-none" maxlength="500" oninput="document.getElementById('summary-counter').innerText = this.value.length + '/500'" placeholder="Nhập tóm tắt (tối đa 500 ký tự)"></textarea>
</section>
<!-- Dynamic Content Sections -->
<div class="space-y-10" id="content-sections-container">
<!-- Section 1 (Default) -->
<section class="space-y-4 p-6 rounded-lg bg-surface-container-low border border-outline-variant/10 relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
<div class="flex items-center gap-3">
<span class="w-8 h-8 flex items-center justify-center rounded-full bg-primary text-on-primary text-xs font-bold">01</span>
<label class="font-headline font-bold text-primary">Nội dung nhỏ 1</label>
</div>
<div class="space-y-4">
<div class="space-y-2">
<div class="flex justify-end"><span class="text-[10px] text-on-surface-variant font-medium">0/100</span></div>
<input class="w-full bg-surface-container-lowest border-none rounded-full px-5 py-3 text-sm focus:ring-2 focus:ring-surface-tint outline-none" placeholder="Tiêu đề nội dung nhỏ 1 (tối đa 100 ký tự)" type="text"/>
</div>
<div class="space-y-2">
<div class="flex justify-end"><span class="text-[10px] text-on-surface-variant font-medium">0/1000</span></div>
<textarea class="w-full min-h-[150px] bg-surface-container-lowest border-none rounded-lg p-5 text-sm focus:ring-2 focus:ring-surface-tint outline-none resize-none" placeholder="Chi tiết nội dung nhỏ 1 (tối đa 1000 ký tự)"></textarea>
</div>
</div>
</section>
</div>
<!-- Add Section Button -->
<button class="w-full py-4 border-2 border-dashed border-outline-variant rounded-full text-on-surface-variant hover:text-primary hover:border-primary hover:bg-primary-fixed/20 transition-all flex items-center justify-center gap-2 font-medium" onclick="addSection()">
<span class="material-symbols-outlined">add_circle</span>
            Thêm phần nội dung (Tối đa 10)
        </button>
<!-- Conclusion -->
<section class="space-y-3">
<div class="flex justify-between items-end">
<label class="font-headline font-bold text-primary ml-1">Kết bài</label>
<span class="text-[10px] text-on-surface-variant font-medium bg-surface-container px-2 py-0.5 rounded-full" id="conclusion-counter">0/500</span>
</div>
<textarea class="w-full min-h-[120px] bg-surface-container-highest border-none rounded-lg p-6 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-surface-tint transition-all outline-none resize-none" maxlength="500" oninput="document.getElementById('conclusion-counter').innerText = this.value.length + '/500'" placeholder="Nhập kết bài (tối đa 500 ký tự)"></textarea>
</section>
<!-- Related Categories -->
<section class="space-y-3">
<label class="font-headline font-bold text-primary ml-1">Thư mục liên quan</label>
<div class="relative">
<select class="w-full bg-surface-container-highest border-none rounded-full px-6 py-4 text-on-surface appearance-none focus:ring-2 focus:ring-surface-tint transition-all outline-none">
<option disabled="" selected="" value="">Chọn thư mục</option>
<option value="hieu-con">Hiểu con</option>
<option value="cung-con">Cùng con</option>
<option value="bao-cao">Báo cáo</option>
</select>
<div class="absolute right-6 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
</section>
<!-- Hashtags -->
<section class="space-y-3">
<div class="flex justify-between items-end">
<label class="font-headline font-bold text-primary ml-1">Hashtag</label>
<span class="text-[10px] text-on-surface-variant font-medium bg-surface-container px-2 py-0.5 rounded-full">0/10 tags</span>
</div>
<input class="w-full bg-surface-container-highest border-none rounded-full px-6 py-4 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-surface-tint transition-all outline-none" placeholder="Nhập tối đa 10 hashtag (vd: #dinhduong)" type="text"/>
</section>
<!-- Submit Button -->
<div class="pt-6 pb-4 flex gap-4">
<button class="flex-1 bg-surface-container-high hover:bg-surface-container-highest text-primary font-headline font-bold py-5 rounded-full border border-outline-variant active:scale-95 transition-all duration-200 uppercase tracking-wider text-sm">
        Xem trước
    </button>
<button class="flex-1 bg-primary hover:bg-primary-container text-on-primary font-headline font-bold py-5 rounded-full shadow-lg shadow-primary/20 active:scale-95 transition-all duration-200 uppercase tracking-wider text-sm">
        Gửi bài viết
    </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 backdrop-blur-xl bg-surface-container-lowest/70 shadow-[0_-8px_24px_rgba(25,28,32,0.04)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-secondary px-5 py-2 hover:text-primary transition-all active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label text-xs font-medium">Trang chủ</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary px-5 py-2 hover:text-primary transition-all active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="explore">explore</span>
<span class="font-label text-xs font-medium">Khám phá</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-5 py-2 active:scale-90 transition-all duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label text-xs font-medium">Bài viết</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary px-5 py-2 hover:text-primary transition-all active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label text-xs font-medium">Cá nhân</span>
</a>
</nav>
<script>
        let sectionCount = 1;
        const maxSections = 10;

        function addSection() {
            if (sectionCount >= maxSections) return;
            sectionCount++;

            const container = document.getElementById('content-sections-container');
            const newSection = document.createElement('section');
            newSection.className = "space-y-4 p-6 rounded-lg bg-surface-container-low border border-outline-variant/10 relative overflow-hidden transition-all animate-in fade-in slide-in-from-bottom-4 duration-500";
            newSection.innerHTML = `
                <div class="absolute top-0 left-0 w-1 h-full bg-primary opacity-50"></div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 flex items-center justify-center rounded-full bg-primary/20 text-primary text-xs font-bold">${String(sectionCount).padStart(2, '0')}</span>
                        <label class="font-headline font-bold text-primary">Nội dung nhỏ ${sectionCount}</label>
                    </div>
                    <button onclick="this.closest('section').remove(); sectionCount--;" class="text-error opacity-40 hover:opacity-100 transition-opacity">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                </div>
                <div class="space-y-4">
                    <div class="space-y-2">
                        <div class="flex justify-end"><span class="text-[10px] text-on-surface-variant font-medium">0/100</span></div>
                        <input type="text" placeholder="Tiêu đề nội dung nhỏ ${sectionCount} (tối đa 100 ký tự)"
                            class="w-full bg-surface-container-lowest border-none rounded-full px-5 py-3 text-sm focus:ring-2 focus:ring-surface-tint outline-none">
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-end"><span class="text-[10px] text-on-surface-variant font-medium">0/1000</span></div>
                        <textarea placeholder="Chi tiết nội dung nhỏ ${sectionCount} (tối đa 1000 ký tự)"
                            class="w-full min-h-[150px] bg-surface-container-lowest border-none rounded-lg p-5 text-sm focus:ring-2 focus:ring-surface-tint outline-none resize-none"></textarea>
                    </div>
                </div>
            `;
            container.appendChild(newSection);
        }
    </script>
</body></html>
