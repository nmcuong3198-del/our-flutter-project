<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Viết bài mới - Thành công</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#e1e2e8",
                    "on-secondary-container": "#56656e",
                    "on-tertiary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#3b4951",
                    "primary-container": "#1a5694",
                    "surface": "#f9f9ff",
                    "tertiary-container": "#7d4800",
                    "secondary-fixed": "#d6e5ef",
                    "inverse-on-surface": "#f0f0f6",
                    "surface-container-high": "#e7e8ee",
                    "error-container": "#ffdad6",
                    "surface-tint": "#28609e",
                    "on-tertiary-fixed": "#2c1600",
                    "background": "#f9f9ff",
                    "on-primary-fixed-variant": "#004884",
                    "on-primary-fixed": "#001c39",
                    "on-primary-container": "#aaccff",
                    "inverse-surface": "#2e3035",
                    "surface-container-low": "#f3f3f9",
                    "on-tertiary-fixed-variant": "#693c00",
                    "surface-bright": "#f9f9ff",
                    "tertiary-fixed-dim": "#ffb870",
                    "tertiary-fixed": "#ffdcbe",
                    "primary": "#003e74",
                    "surface-container": "#ededf3",
                    "secondary-container": "#d3e2ed",
                    "on-primary": "#ffffff",
                    "on-tertiary-container": "#ffbc7a",
                    "on-background": "#191c20",
                    "on-surface": "#191c20",
                    "on-secondary-fixed": "#0f1d25",
                    "surface-dim": "#d9dadf",
                    "secondary": "#526069",
                    "on-error-container": "#93000a",
                    "error": "#ba1a1a",
                    "outline": "#727781",
                    "primary-fixed": "#d4e3ff",
                    "surface-container-highest": "#e1e2e8",
                    "primary-fixed-dim": "#a4c9ff",
                    "outline-variant": "#c2c6d2",
                    "tertiary": "#5c3400",
                    "on-error": "#ffffff",
                    "secondary-fixed-dim": "#bac9d3",
                    "on-surface-variant": "#424750",
                    "inverse-primary": "#a4c9ff"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "display": ["Plus Jakarta Sans"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-[0_24px_40px_rgba(25,28,32,0.04)] flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-200 hover:bg-surface-container-highest transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline text-headline-sm font-bold text-primary">Viết bài mới</h1>
</div>
<button class="active:scale-95 transition-transform duration-200 hover:bg-surface-container-highest transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-primary">more_vert</span>
</button>
</header>
<!-- Main Content Canvas (Editor Mockup) -->
<main class="flex-grow pt-24 pb-12 px-6 max-w-2xl mx-auto w-full">
<div class="space-y-8 opacity-40 select-none pointer-events-none">
<div class="bg-surface-container-low p-8 rounded-xl space-y-6">
<div class="h-10 w-3/4 bg-surface-container-highest rounded-md"></div>
<div class="space-y-3">
<div class="h-4 w-full bg-surface-container-highest rounded-md"></div>
<div class="h-4 w-full bg-surface-container-highest rounded-md"></div>
<div class="h-4 w-5/6 bg-surface-container-highest rounded-md"></div>
</div>
</div>
<div class="grid grid-cols-3 gap-4">
<div class="aspect-square rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">add_a_photo</span>
</div>
<div class="aspect-square rounded-lg bg-surface-container-highest"></div>
<div class="aspect-square rounded-lg bg-surface-container-highest"></div>
</div>
<div class="flex items-center gap-4 p-4 bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-primary">location_on</span>
<div class="h-4 w-32 bg-surface-container-highest rounded-md"></div>
</div>
</div>
</main>
<!-- Success Notification Overlay -->
<div class="fixed inset-0 z-[100] flex items-center justify-center px-6 bg-on-background/10 backdrop-blur-md transition-opacity duration-300" id="success-overlay">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-sm rounded-xl p-8 shadow-[0_32px_64px_rgba(25,28,32,0.12)] transform scale-100 transition-transform duration-300">
<div class="flex flex-col items-center text-center space-y-6">
<!-- Success Icon Cluster -->
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Message Content -->
<div class="space-y-3">
<h2 class="text-xl font-bold text-primary font-headline tracking-tight">Gửi bài thành công</h2>
<p class="text-on-surface-variant font-body leading-relaxed">
                        Bài viết đã được gửi để hệ thống kiểm duyệt theo quy định
                    </p>
</div>
<!-- Primary Action Button -->
<button class="w-full py-4 bg-primary-container text-white font-bold rounded-full active:scale-95 transition-all duration-200 shadow-lg shadow-primary-container/20 hover:brightness-110" onclick="closePopup()">
                    Đã hiểu
                </button>
</div>
</div>
</div>
<!-- Bottom Navigation (Filtered for Content Canvas priority, but kept for context as per layout requirements) -->
<nav class="fixed bottom-0 w-full z-50 bg-surface rounded-t-xl shadow-[0_-8px_24px_rgba(25,28,32,0.06)] flex justify-around items-center px-4 py-3 pb-safe">
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-xs font-medium mt-1">Trang chủ</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">restaurant</span>
<span class="font-label text-xs font-medium mt-1">Dinh dưỡng</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1.5">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">child_care</span>
<span class="font-label text-xs font-medium mt-1">Hoạt động</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">person</span>
<span class="font-label text-xs font-medium mt-1">Cá nhân</span>
</div>
</nav>
<script>
        function closePopup() {
            const overlay = document.getElementById('success-overlay');
            overlay.classList.add('opacity-0');
            overlay.classList.add('pointer-events-none');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
        }
    </script>
</body></html>
