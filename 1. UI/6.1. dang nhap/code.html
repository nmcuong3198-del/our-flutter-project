<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập | SSCare</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-container": "#ffbc7a",
                      "primary-fixed": "#d4e3ff",
                      "on-primary-fixed": "#001c39",
                      "on-primary": "#ffffff",
                      "background": "#f9f9ff",
                      "outline": "#727781",
                      "on-secondary-fixed": "#0f1d25",
                      "on-secondary-container": "#56656e",
                      "inverse-on-surface": "#f0f0f6",
                      "on-primary-container": "#aaccff",
                      "inverse-surface": "#2e3035",
                      "primary-fixed-dim": "#a4c9ff",
                      "on-tertiary-fixed": "#2c1600",
                      "primary": "#003e74",
                      "secondary-fixed": "#d6e5ef",
                      "on-tertiary": "#ffffff",
                      "error": "#ba1a1a",
                      "on-secondary": "#ffffff",
                      "on-surface-variant": "#424750",
                      "on-surface": "#191c20",
                      "surface-container": "#ededf3",
                      "error-container": "#ffdad6",
                      "primary-container": "#1a5694",
                      "tertiary-fixed": "#ffdcbe",
                      "secondary-container": "#d3e2ed",
                      "on-error-container": "#93000a",
                      "tertiary-container": "#7d4800",
                      "surface-container-low": "#f3f3f9",
                      "outline-variant": "#c2c6d2",
                      "surface-bright": "#f9f9ff",
                      "inverse-primary": "#a4c9ff",
                      "surface-dim": "#d9dadf",
                      "on-background": "#191c20",
                      "on-tertiary-fixed-variant": "#693c00",
                      "surface-container-highest": "#e1e2e8",
                      "surface-container-high": "#e7e8ee",
                      "secondary-fixed-dim": "#bac9d3",
                      "surface-tint": "#28609e",
                      "secondary": "#526069",
                      "tertiary-fixed-dim": "#ffb870",
                      "surface-variant": "#e1e2e8",
                      "on-error": "#ffffff",
                      "on-secondary-fixed-variant": "#3b4951",
                      "on-primary-fixed-variant": "#004884",
                      "surface": "#f9f9ff",
                      "tertiary": "#5c3400",
                      "surface-container-lowest": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Plus Jakarta Sans"],
                      "display": ["Plus Jakarta Sans"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface min-h-screen flex flex-col items-center justify-center p-6 sm:p-12 selection:bg-primary-fixed-dim">
<!-- Transactional Screen: Navigation Shell Suppressed as per Blueprint Rules -->
<div class="w-full max-w-md space-y-10">
<!-- Header Section: Logo & Titles -->
<div class="flex flex-col items-center text-center space-y-6">
<div class="rounded-xl overflow-hidden shadow-sm bg-surface-container-lowest flex items-center justify-center p-4 w-32 h-32">
<img alt="SSCare Official Logo" class="w-full h-full object-contain" data-alt="SSCare official brand logo with figure reaching for a star" src="https://lh3.googleusercontent.com/aida/ADBb0ugpH-Dg9LRdF7HkjPhB9Bzufto6jL0UFnxpXTsX4zZupm626MoliXD8j_INAdW8634SK7_mtcLQn6_jI8arMMTTbAeI44HsEO8x4LcH2JO1mcE3Okh-bpFuF4EfoTN5fScLU5UilJjkVGKvHQSSEwbZnnEP97czDUpwdl-6gk1B_Tv1UC7v8xX_FH7zfrMg_kiYIGSdiG4sbTBCoTfs5W4BV6NuPFAd9RNv4-_9liaDu1hpnnS7bJm-ZEKZqCAeXZGWC6_6jBCNDg"/>
</div>
<div class="space-y-2">
<h1 class="text-4xl font-extrabold text-primary tracking-tight">Xin chào 👋</h1>
<p class="text-on-surface-variant font-medium text-lg">Đăng nhập để tiếp tục</p>
</div>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email / Phone Input -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface ml-4" for="identity">Email / Số điện thoại</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-surface-tint focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant text-on-surface font-medium" id="identity" placeholder="example@email.com" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-4">
<label class="block text-sm font-semibold text-on-surface" for="password">Mật khẩu</label>
<a class="text-sm font-bold text-primary hover:text-primary-container transition-colors" href="#">Quên mật khẩu?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-surface-tint focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant text-on-surface font-medium" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-5 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Main Login Action -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-white font-bold py-5 rounded-full shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all text-lg tracking-wide" type="submit">
                ĐĂNG NHẬP
            </button>
</form>
<!-- Divider Section -->
<div class="relative flex items-center py-2">
<div class="flex-grow h-px bg-surface-container-high"></div>
<span class="flex-shrink mx-4 text-sm font-medium text-outline-variant">hoặc</span>
<div class="flex-grow h-px bg-surface-container-high"></div>
</div>
<!-- Secondary Action Section -->
<div class="space-y-6 text-center">
<div class="flex flex-col items-center gap-4">
<span class="text-on-surface-variant font-medium">Chưa có tài khoản?</span>
<button class="w-full py-4 px-8 border-2 border-primary text-primary font-bold rounded-full hover:bg-primary-fixed/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">person_add</span>
                    TẠO TÀI KHOẢN
                </button>
</div>
</div>
</div>
<!-- Background Decoration: Subtle Tonal Zones -->
<div class="fixed top-0 left-0 -z-10 w-full h-full overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -right-[5%] w-[400px] h-[400px] rounded-full bg-secondary-container/20 blur-3xl"></div>
<div class="absolute -bottom-[5%] -left-[5%] w-[300px] h-[300px] rounded-full bg-tertiary-fixed-dim/10 blur-3xl"></div>
</div>
</body></html>
