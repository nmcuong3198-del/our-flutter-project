<body class="bg-surface font-body text-on-surface min-h-screen overflow-hidden flex flex-col">
<!-- Background Blur Wrapper -->
<div class="fixed inset-0 blur-background z-0 scale-110" data-alt="Close-up of a high-end editorial health magazine layout with vibrant typography and soft lighting on a wooden desk background."></div>
<!-- Content Overlay -->
<div class="relative z-10 flex-grow flex items-center justify-center px-6">
<!-- Popup Modal -->
<div class="bg-surface-bright/90 backdrop-blur-2xl w-full max-w-sm rounded-xl shadow-[0_24px_40px_rgba(0,62,116,0.1)] p-8 border border-white/20">
<!-- TopAppBar Style Anchor -->
<div class="space-y-6">
<!-- Title -->
<div class="text-center">
<h2 class="font-headline font-extrabold text-2xl text-primary tracking-tight">Chia sẻ bài viết</h2>
<p class="text-on-secondary-container text-sm mt-2">Gửi bài viết này đến bạn bè và người thân của bạn.</p>
</div>
<!-- Input Field -->
<div class="space-y-2">
<label class="text-xs font-bold text-primary px-1 uppercase tracking-wider">Người nhận</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-md py-4 px-5 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-surface-tint focus:ring-opacity-20 transition-all font-body text-sm" placeholder="Nhập email hoặc tên người nhận" type="text"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-full font-headline font-bold text-lg shadow-lg hover:opacity-90 active:scale-95 transition-all">
          Gửi
        </button>
<!-- Social Quick Share -->
</div>
</div>
</div>
<!-- Dimmed Bottom Nav Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-surface-bright/40 backdrop-blur-sm opacity-50 grayscale pointer-events-none rounded-t-xl">
<!-- Home (Inactive) -->
<div class="flex flex-col items-center justify-center text-primary/60">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-body text-[11px] font-medium tracking-wide">Home</span>
</div>
<!-- Library (Active - Intent Mapping for "Article") -->
<div class="flex flex-col items-center justify-center bg-primary text-white rounded-full px-5 py-1">
<span class="material-symbols-outlined" data-icon="menu_book" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<span class="font-body text-[11px] font-medium tracking-wide">Library</span>
</div>
<!-- Saved (Inactive) -->
<div class="flex flex-col items-center justify-center text-primary/60">
<span class="material-symbols-outlined" data-icon="bookmark">bookmark</span>
<span class="font-body text-[11px] font-medium tracking-wide">Saved</span>
</div>
<!-- Profile (Inactive) -->
<div class="flex flex-col items-center justify-center text-primary/60">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-body text-[11px] font-medium tracking-wide">Profile</span>
</div>
</nav>
